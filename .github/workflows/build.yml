name: Build Eden Launcher

on:
  push:
    branches: [ "main", "master", "claude/**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  # Same SDL3 release line Eden builds against (cpmfile.json "sdl3")
  SDL3_VERSION: "3.4.8"

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install test dependencies
      run: python -m pip install pycryptodome Pillow
    - name: Run tests
      run: python -m unittest discover -s tests -v

  build:
    name: Build on ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: EdenLauncher.exe
            upload_name: EdenLauncher-Windows

          - os: ubuntu-latest
            artifact_name: EdenLauncher
            upload_name: EdenLauncher-Linux

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Eden for Windows may link SDL statically, so the launcher carries its
    # own SDL3.dll (picked up by build.bat from sdl\)
    - name: Fetch SDL3.dll (Windows only)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $zip = "SDL3-$env:SDL3_VERSION-win32-x64.zip"
        Invoke-WebRequest "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL3_VERSION/$zip" -OutFile $zip
        Expand-Archive $zip -DestinationPath sdl-extract
        New-Item -ItemType Directory -Force sdl | Out-Null
        Get-ChildItem sdl-extract -Recurse -Filter SDL3.dll | Select-Object -First 1 | Copy-Item -Destination sdl\
        if (-not (Test-Path sdl\SDL3.dll)) { throw "SDL3.dll not found in $zip" }

    - name: Install Tk and build SDL3 (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev cmake build-essential python3-tk
        git clone https://github.com/libsdl-org/SDL.git --branch "release-$SDL3_VERSION" --depth 1
        # The launcher only needs SDL's joystick/gamepad subsystems
        cd SDL && cmake -B build -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF \
          -DSDL_UNIX_CONSOLE_BUILD=ON -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_AUDIO=OFF -DSDL_GPU=OFF -DSDL_RENDER=OFF -DSDL_CAMERA=OFF
        cmake --build build --parallel
        sudo cmake --install build

    # The exe knows which release it is (footer, settings screen, update check)
    - name: Stamp the build number
      shell: python
      env:
        BUILD_NUMBER: ${{ github.run_number }}
      run: |
        import os, re
        path = os.path.join("src", "Core", "Build.py")
        text = open(path, encoding="utf-8").read()
        text, count = re.subn(r"^BUILD = \d+$", "BUILD = " + os.environ["BUILD_NUMBER"], text, flags=re.M)
        assert count == 1, "BUILD line not found"
        open(path, "w", encoding="utf-8").write(text)
        print(text)

    # Asking a program to close the way the launcher asks the emulator: a
    # small Tk window in a child process must go away by itself. A warning
    # only - a runner without a desktop cannot show the window at all.
    - name: Smoke-test closing a window (Windows)
      if: runner.os == 'Windows'
      shell: python
      run: |
        import subprocess, sys, time
        sys.path.insert(0, "src")
        from Core.Process import request_close
        child = subprocess.Popen([sys.executable, "-c",
            "import tkinter as tk, os; r = tk.Tk(); r.after(20000, lambda: os._exit(7)); r.mainloop()"])
        time.sleep(4)
        delivered = request_close(child)
        try:
            code = child.wait(timeout=8)
        except subprocess.TimeoutExpired:
            child.kill()
            code = "still running"
        print("request_close delivered:", delivered, "- child exit:", code)
        if not delivered or code != 0:
            print("::warning::request_close did not close the test window (delivered=%s, exit=%s)" % (delivered, code))

    # The runner usually has no sound card: this proves the winmm calls are
    # well formed (a bad ctypes argument raises TypeError/ArgumentError, a
    # missing device only an OSError the launcher falls back from)
    - name: Smoke-test the sound mixer output (Windows)
      if: runner.os == 'Windows'
      shell: python
      run: |
        import sys, time
        from array import array
        sys.path.insert(0, "src")
        from Core.Sound import Mixer, _WaveOut
        mixer = Mixer()
        try:
            output = _WaveOut(mixer)
        except OSError as e:
            print("No audio device on the runner:", e)
        else:
            mixer.add(array("h", [1000] * 4000))
            output.wake()
            time.sleep(0.5)
            output.keep_open = False
            time.sleep(1.5)
            print("waveOut played and closed, handle:", output.handle)
            assert output.handle is None

    - name: Build with build.bat (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        call .\build.bat Eden
        if errorlevel 1 exit /b 1

    # The built exe must at least start: every module bundled, Tk and the
    # SDL library loading (Core/Bootstrap.selftest). Nothing is shown.
    - name: Self-test the built exe (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        set EDEN_LAUNCHER_SELFTEST=1
        start /wait "" dist\EdenLauncher.exe
        if exist dist\EdenLauncher.crash.log type dist\EdenLauncher.crash.log
        if not exist dist\EdenLauncher.selftest.ok (
          echo Self-test failed: the exe did not start
          exit /b 1
        )
        type dist\EdenLauncher.selftest.ok
        del dist\EdenLauncher.selftest.ok

    - name: Build with build.sh (Linux)
      if: runner.os != 'Windows'
      run: ./build.sh Eden

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.upload_name }}
        path: dist/${{ matrix.artifact_name }}

  # Publish the Windows exe on the Releases page: a direct download, no zip,
  # no expiry, visible from the GitHub mobile app too
  release:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: EdenLauncher-Windows
        path: out

    - uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: Eden Launcher (build ${{ github.run_number }})
        target_commitish: ${{ github.sha }}
        make_latest: true
        body: |
          Windows build from `${{ github.ref_name }}` @ ${{ github.sha }}.
          Download **EdenLauncher.exe** and put it next to `eden.exe`.
        files: out/EdenLauncher.exe
